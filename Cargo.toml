[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "1.0.0"
edition = "2024"
license = "MIT"
authors = ["Smoffyy"]
repository = "https://github.com/Smoffyy/quill-code"
publish = false

[workspace.dependencies]
quill-config = { path = "crates/quill-config" }
quill-core = { path = "crates/quill-core" }
quill-git = { path = "crates/quill-git" }
quill-providers = { path = "crates/quill-providers" }
quill-weave = { path = "crates/quill-weave" }

[profile.dev.package."*"]
opt-level = 2

[profile.release]
lto = "thin"
codegen-units = 1
strip = true