[package]
name = "quill-code"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "quill"
path = "src/main.rs"

[dependencies]
base64 = "0.23"
clap = { version = "4.6.7", features = ["derive"] }
crossterm = { version = "0.29.0", default-features = false, features = ["bracketed-paste", "events", "windows"] }
ctrlc = "3.5.2"
pulldown-cmark = { version = "0.13.4", default-features = false }
quill-config.workspace = true
quill-core.workspace = true
quill-git.workspace = true
quill-providers.workspace = true
quill-weave.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json = "1"
unicode-width = "0.2.2"